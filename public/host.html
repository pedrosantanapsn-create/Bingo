<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo — host</title>
<meta name="description" content="Bingo de imagens ao vivo. Entre com o código, receba sua cartela e acompanhe o sorteio.">
<meta name="theme-color" content="#1f3b2f">
<meta property="og:title" content="Bingo">
<meta property="og:description" content="Bingo de imagens ao vivo. Entre com o código e receba sua cartela.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3b2f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23f5f1e6' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='26' text-anchor='middle' fill='%23f5f1e6'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <header><a href="/">Bingo</a><small>host</small></header>
  <div id="app"><p class="muted">Carregando…</p></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
(() => {
  const { $, toast, api, store, fileToThumb, hits, board, history, stage, winnersList, statusLabel, watch } = Bingo;
  const params = new URLSearchParams(location.search);
  const code = (params.get("c") || "").toUpperCase(), token = params.get("t") || "";
  const app = document.getElementById("app");
  const H = (method, path, body) => api(method, "/api/games/" + code + path, body, { "x-host-token": token });
  let state = null, images = {}, cards = [], players = [], winners = [], openWinner = null, autoTimer = null, autoSec = 8, openCard = null, confirmKey = null, pickMode = false, lastCounts = "", namesOpen = false;
  const screenOpts = store.get("screen:" + code) || { tema: "auto", cor: "" };
  const need = (g) => (g === 5 ? 24 : g * g);

  if (!code || !token) { app.replaceChildren($("div", { class: "error" }, "Link de host inválido.")); return; }

  watch(code, async (s, imgs) => {
    if (!s) { app.replaceChildren($("div", { class: "error" }, "Este bingo foi apagado."), $("a", { href: "/" }, "Início")); return; }
    state = s; images = imgs;
    const counts = s.playerCount + "/" + s.cardCount + "/" + s.status + "/" + s.winnerCount;
    if (counts !== lastCounts) { lastCounts = counts; await refreshLists(); }
    render();
  });
  async function refreshLists() {
    try { const [c, p, w] = await Promise.all([H("GET", "/cards"), api("GET", "/api/games/" + code + "/players"), H("GET", "/winners")]); cards = c.cards; players = p.players; winners = w.winners; } catch (e) { toast(e.message); }
  }
  async function run(fn) { try { await fn(); } catch (e) { toast(e.message); } }
  document.addEventListener("keydown", (e) => {
    if (!state || state.status !== "playing" || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); run(() => H("POST", "/draw")); }
    else if (e.key === "z" || e.key === "Backspace") { e.preventDefault(); run(() => H("POST", "/undo")); }
    else if (e.key === "a") { autoTimer ? (stopAuto(), render()) : startAuto(); }
  });
  function stopAuto() { if (autoTimer) clearInterval(autoTimer); autoTimer = null; }
  function startAuto() { stopAuto(); autoTimer = setInterval(() => run(() => H("POST", "/draw")), autoSec * 1000); render(); }

  function confirmBtn(label, key, action) {
    if (confirmKey === key) return $("span", { class: "confirm" }, label + "?", $("button", { class: "primary small", onclick: () => { confirmKey = null; action(); } }, "Sim"), $("button", { class: "small", onclick: () => { confirmKey = null; render(); } }, "Não"));
    return $("button", { onclick: () => { confirmKey = key; render(); } }, label);
  }
  const copy = (text, msg) => navigator.clipboard?.writeText(text).then(() => toast(msg)).catch(() => toast("Copie manualmente"));
  function shareBox() {
    const link = location.origin + "/play?c=" + code;
    return $("div", { class: "share" },
      $("div", { class: "row" }, $("span", { class: "code grow" }, code), $("button", { class: "small", onclick: () => copy(link, "Link copiado") }, "Copiar link dos jogadores")),
      $("span", { class: "note" }, link));
  }
  function playersList() {
    if (!players.length) return $("p", { class: "note" }, "Ninguém entrou ainda.");
    const many = players.length > 12;
    return $("div", {},
      $("div", { class: "names" + (many && !namesOpen ? " collapsed" : ""), style: "justify-content:flex-start" }, ...players.map((p) => $("span", {}, p.name))),
      many ? $("button", { class: "names-toggle", onclick: () => { namesOpen = !namesOpen; render(); } }, namesOpen ? "Mostrar menos" : "Mostrar todos os " + players.length) : null);
  }
  function screenLink() {
    const p = new URLSearchParams({ c: code });
    if (screenOpts.tema !== "auto") p.set("tema", screenOpts.tema);
    if (screenOpts.cor) p.set("cor", screenOpts.cor.replace("#", ""));
    return location.origin + "/tela?" + p.toString();
  }
  function screenBox() {
    const temaSel = $("select", { onchange: (e) => { screenOpts.tema = e.target.value; store.set("screen:" + code, screenOpts); render(); } },
      ...[["auto", "Automático"], ["light", "Claro"], ["dark", "Escuro"]].map(([v, t]) => { const o = $("option", { value: v }, t); if (screenOpts.tema === v) o.selected = true; return o; }));
    const corIn = $("input", { type: "color", value: screenOpts.cor || "#e8432a", style: "width:60px;padding:2px", onchange: (e) => { screenOpts.cor = e.target.value; store.set("screen:" + code, screenOpts); render(); } });
    return $("div", { class: "share" },
      $("div", { class: "row" }, $("label", { class: "grow" }, "Tema", temaSel), $("label", {}, "Cor do canal", corIn), screenOpts.cor ? $("button", { class: "small", onclick: () => { screenOpts.cor = ""; store.set("screen:" + code, screenOpts); render(); } }, "Padrão") : null),
      $("div", { class: "row" }, $("span", { class: "note grow" }, screenLink()), $("button", { class: "small", onclick: () => copy(screenLink(), "Link da tela copiado") }, "Copiar"), $("a", { href: screenLink(), target: "_blank" }, "abrir")),
      $("span", { class: "note" }, "No OBS: Fontes → Fonte de navegador → cole o link, 1920 × 1080."));
  }
  function cardsList(drawn) {
    if (!cards.length) return $("p", { class: "note" }, "Nenhuma cartela.");
    const winners = new Set(state.winners.map((w) => w.cardId));
    return $("div", { class: "list" }, ...cards.map((c) => {
      const done = hits(c.cells, drawn), total = c.cells.length;
      const row = $("div", { class: "line link", onclick: () => { openCard = openCard === c.id ? null : c.id; render(); } },
        $("div", { class: "grow" }, $("h3", {}, c.n + ". " + c.player), $("div", { class: "bar" }, $("span", { style: "width:" + Math.round((100 * done) / total) + "%" })), $("span", { class: "note" }, done + " de " + total)),
        winners.has(c.id) ? $("span", { class: "tag fill" }, "Bingo") : null,
        state.status === "setup" ? $("button", { class: "small", onclick: (e) => { e.stopPropagation(); run(() => H("DELETE", "/cards/" + c.id)); } }, "excluir") : null);
      return openCard === c.id ? $("div", {}, row, board(c, state.grid, images, drawn)) : row;
    }));
  }

  function render() {
    const s = state, drawn = new Set(s.draws), byId = images;
    app.replaceChildren();
    app.append($("h1", {}, s.name), $("p", { class: "note" }, statusLabel(s.status) + " · " + s.grid + "×" + s.grid + " · " + (s.pattern === "full" ? "cartela cheia" : "linha, coluna ou diagonal")));
    const L = $("div", { class: "col" }), R = $("div", { class: "col" });
    app.append($("div", { class: "cols" }, L, R));

    if (s.status === "setup") {
      L.append($("div", { class: "stats" }, $("div", {}, $("b", {}, s.items.length), $("span", {}, "imagens (mín. " + need(s.grid) + ")")), $("div", {}, $("b", {}, s.playerCount), $("span", {}, "na sala de espera"))));
      const file = $("input", { type: "file", accept: "image/*", multiple: "", hidden: true, onchange: async (e) => {
        const files = Array.from(e.target.files); e.target.value = ""; let ok = 0;
        for (const f of files) { try { const img = await fileToThumb(f); await H("POST", "/items", { name: f.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").slice(0, 30), img }); ok++; } catch (ex) { toast(f.name + ": " + ex.message); } }
        if (ok) toast(ok + " imagem(ns) adicionada(s)");
      } });
      L.append($("h2", {}, "Imagens"),
        $("div", { class: "row" }, $("button", { class: "primary", onclick: () => file.click() }, "Enviar imagens"), file),
        s.items.length ? $("div", { class: "grid-items", style: "margin-top:14px" }, ...s.items.map((it) => $("div", { class: "tile" },
          byId[it.id] ? $("img", { src: byId[it.id].img, alt: it.name }) : $("div", { class: "empty" }),
          $("input", { value: it.name, maxlength: "30", onchange: (e) => run(() => H("PATCH", "/items/" + it.id, { name: e.target.value })) }),
          $("button", { class: "del", onclick: () => run(() => H("DELETE", "/items/" + it.id)) }, "excluir")))) : null);

      R.append($("h2", {}, "Link"), shareBox());
      R.append($("h2", {}, "Sala de espera (" + s.playerCount + ")"), playersList());
      R.append($("h2", {}, "Tela da live"), screenBox());

      R.append($("h2", {}, "Iniciar"),
        $("p", { class: "note" }, "Cada pessoa da sala de espera recebe a sua cartela e a entrada é fechada."),
        $("div", { class: "row" },
          $("button", { class: "primary", disabled: s.items.length < need(s.grid), onclick: () => run(() => H("POST", "/status", { status: "playing" })) }, "Iniciar o bingo"),
          confirmBtn("Apagar este bingo", "del", () => run(async () => { await H("DELETE", ""); location.href = "/"; }))));
      return;
    }

    const last = s.draws.length ? byId[s.draws[s.draws.length - 1]] : null;
    L.append(stage(last, s.draws.length + " de " + s.items.length + " sorteadas"));
    if (s.status === "playing") {
      const left = s.items.length - s.draws.length;
      const secIn = $("input", { type: "number", min: "3", max: "60", value: String(autoSec), onchange: (e) => { autoSec = Math.max(3, Number(e.target.value) || 8); if (autoTimer) startAuto(); } });
      L.append($("div", { class: "controls" },
        $("button", { class: "primary", disabled: left < 1, onclick: () => run(() => H("POST", "/draw")) }, "Sortear próxima"),
        autoTimer ? $("button", { onclick: () => { stopAuto(); render(); } }, "Pausar") : $("button", { disabled: left < 1, onclick: startAuto }, "Automático"),
        $("label", {}, "a cada", secIn, "s"),
        $("button", { disabled: left < 1, onclick: () => { pickMode = !pickMode; render(); } }, pickMode ? "Fechar escolha" : "Escolher imagem"),
        $("button", { disabled: !s.draws.length, onclick: () => run(() => H("POST", "/undo")) }, "Desfazer")),
        $("p", { class: "note kbd" }, "Teclado: espaço sorteia · Z desfaz · A liga o automático"));
      if (pickMode) {
        const rest = s.items.filter((it) => !drawn.has(it.id));
        L.append($("h2", {}, "Toque na imagem para sorteá-la"), $("div", { class: "grid-items" }, ...rest.map((it) => $("div", { class: "tile pick", onclick: () => run(() => H("POST", "/draw", { itemId: it.id })) }, byId[it.id] ? $("img", { src: byId[it.id].img, alt: it.name }) : null, $("span", { class: "note" }, it.name)))));
      }
    }
    if (winners.length) {
      const wset = new Set(winners.map((w) => w.cardId));
      const byCard = Object.fromEntries(cards.map((c) => [c.id, c]));
      L.append($("h2", {}, "Vencedores (só você vê)"),
        $("label", { class: "check", style: "margin-bottom:12px" }, $("input", { type: "checkbox", checked: s.winnersShown, onchange: (e) => run(() => H("POST", "/settings", { showWinners: e.target.checked })) }), "Mostrar os vencedores na tela da live e para os jogadores"),
        $("div", { class: "list" }, ...winners.map((w, i) => {
          const c = byCard[w.cardId];
          const row = $("div", { class: "line link", onclick: () => { openWinner = openWinner === w.cardId ? null : w.cardId; render(); } },
            $("b", { style: "font-size:1.4rem;font-weight:normal;color:var(--mark)" }, (i + 1) + "º"),
            $("div", { class: "grow" }, $("h3", {}, w.player + " · cartela " + w.n), $("span", { class: "note" }, w.how + " · no " + w.drawIndex + "º sorteio · " + new Date(w.at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }))),
            $("span", { class: "tag" }, openWinner === w.cardId ? "fechar" : "ver cartela"));
          return openWinner === w.cardId && c ? $("div", {}, row, board(c, s.grid, images, drawn)) : row;
        })));
    }
    L.append($("h2", {}, "Já sorteadas"), s.draws.length ? history(s.draws, byId) : $("p", { class: "note" }, "Ainda nenhuma."));
    R.append($("h2", {}, "Cartelas (" + cards.length + ")"),
      $("label", { class: "check", style: "margin-bottom:10px" }, $("input", { type: "checkbox", checked: s.allowJoin, onchange: (e) => run(() => H("POST", "/settings", { allowJoin: e.target.checked })) }), "Permitir entrada de novos jogadores"),
      cardsList(drawn));
    R.append($("h2", {}, "Link"), shareBox());
    R.append($("h2", {}, "Tela da live"), screenBox());
    R.append($("h2", {}, "Controle"), $("div", { class: "row" },
      s.status === "playing" ? confirmBtn("Encerrar o bingo", "end", () => { stopAuto(); run(() => H("POST", "/status", { status: "finished" })); }) : $("button", { class: "primary", onclick: () => run(() => H("POST", "/status", { status: "playing" })) }, "Reabrir"),
      s.status === "playing" ? confirmBtn("Reiniciar sorteio", "reset", () => { stopAuto(); run(() => H("POST", "/reset")); }) : null,
      $("button", { onclick: () => { stopAuto(); run(() => H("POST", "/status", { status: "setup" })); } }, "Voltar à preparação")));
  }
})();
</script>
</body>
</html>

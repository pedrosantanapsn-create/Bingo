<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<meta name="description" content="Bingo de imagens ao vivo. Entre com o código, receba sua cartela e acompanhe o sorteio.">
<meta name="theme-color" content="#1f3b2f">
<meta property="og:title" content="Bingo">
<meta property="og:description" content="Bingo de imagens ao vivo. Entre com o código e receba sua cartela.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3b2f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23f5f1e6' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='26' text-anchor='middle' fill='%23f5f1e6'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <header><a href="/">Bingo</a><small id="hdr"></small></header>
  <div id="app"><p class="muted">Carregando…</p></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
(() => {
  const { $, toast, api, store, checkPattern, hits, board, history, stage, winnersList, watch } = Bingo;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  const app = document.getElementById("app");
  let state = null, images = {}, me = store.get("player:" + code), cards = [], lastStatus = null, lastBingo = null;

  if (!code) { location.href = "/"; return; }

  watch(code, async (s, imgs) => {
    if (!s) { app.replaceChildren($("div", { class: "error" }, "Este bingo foi apagado pelo host."), $("a", { href: "/" }, "Início")); return; }
    state = s; images = imgs;
    if (me && (s.status !== lastStatus || (s.status !== "setup" && !cards.length))) { lastStatus = s.status; await loadMe(); }
    render();
  });
  async function loadMe() {
    try { const r = await api("GET", "/api/games/" + code + "/me?player=" + me.id, null, { "x-player-token": me.token }); cards = r.cards; me.name = r.name; }
    catch { me = null; store.set("player:" + code, null); cards = []; }
  }
  async function join(name) {
    try {
      const r = await api("POST", "/api/games/" + code + "/join", { player: name });
      me = { id: r.playerId, token: r.playerToken, name: r.name }; store.set("player:" + code, me);
      await loadMe(); render();
    } catch (e) { toast(e.message); }
  }

  function render() {
    const s = state, drawn = new Set(s.draws), byId = images;
    app.replaceChildren();
    document.getElementById("hdr").textContent = s.name;

    if (!me) {
      if (s.status === "finished") { app.append($("h1", {}, s.name), $("p", {}, "Este bingo já foi encerrado.")); return; }
      if (!s.allowJoin) { app.append($("h1", {}, s.name), $("p", {}, "O bingo já começou e a entrada foi fechada.")); return; }
      const nameIn = $("input", { placeholder: "Seu nome", maxlength: "30", required: "" });
      app.append($("h1", {}, s.name),
        $("form", { class: "row", onsubmit: (e) => { e.preventDefault(); join(nameIn.value.trim()); } }, $("label", { class: "grow" }, "Nome", nameIn), $("button", { class: "primary", type: "submit" }, "Entrar")),
        $("p", { class: "note", style: "margin-top:10px" }, s.playerCount + (s.playerCount === 1 ? " pessoa" : " pessoas") + " na sala de espera"));
      return;
    }

    if (s.status === "setup" || !cards.length) {
      app.append($("h1", {}, s.name),
        $("div", { class: "waiting" }, $("div", { class: "big" }, s.playerCount), $("div", { class: "label" }, "na sala de espera"), $("p", { style: "margin-top:20px" }, "Olá, " + me.name + ". Sua cartela aparece assim que o host iniciar.")),
        $("p", {}, $("button", { class: "small", onclick: () => { me = null; store.set("player:" + code, null); render(); } }, "Sair")));
      return;
    }

    const mine = cards[0];
    const how = checkPattern(mine.cells, s.grid, s.pattern, drawn);
    const rank = s.winners.findIndex((w) => w.cardId === mine.id);
    const fresh = how && lastBingo !== mine.id;
    if (how) app.append($("div", { class: "bingo" + (fresh ? " pulse" : "") }, $("b", {}, "Bingo"), how + (rank >= 0 ? " · " + (rank + 1) + "º lugar" : " · avise o host")));
    if (fresh) { lastBingo = mine.id; try { navigator.vibrate?.([200, 100, 200]); } catch {} }

    const last = s.draws.length ? byId[s.draws[s.draws.length - 1]] : null;
    app.append(stage(last, s.draws.length + " sorteadas · " + hits(mine.cells, drawn) + " de " + mine.cells.length + " na sua cartela", "Aguardando"));
    app.append($("h2", {}, "Cartela " + mine.n + " · " + mine.player), board(mine, s.grid, byId, drawn));
    cards.slice(1).forEach((c) => app.append($("h2", {}, "Cartela " + c.n), board(c, s.grid, byId, drawn)));
    if (s.draws.length) app.append($("h2", {}, "Já sorteadas"), history(s.draws, byId));
    if (s.winners.length) app.append($("h2", {}, "Vencedores"), winnersList(s.winners));
  }
})();
</script>
</body>
</html>

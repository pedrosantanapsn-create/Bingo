<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<meta name="description" content="Bingo de imagens ao vivo. Entre com o código, receba sua cartela e acompanhe o sorteio.">
<meta name="theme-color" content="#1f3b2f">
<meta property="og:title" content="Bingo">
<meta property="og:description" content="Bingo de imagens ao vivo. Entre com o código e receba sua cartela.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3b2f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23f5f1e6' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='26' text-anchor='middle' fill='%23f5f1e6'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <header><a href="/">Bingo</a></header>

  <div class="hero">
    <h1>Digite o código</h1>
    <form id="joinForm">
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" aria-label="Código do bingo" required>
      <button class="primary" type="submit">Entrar</button>
    </form>
    <div id="joinErr" class="error" hidden></div>
  </div>

  <details class="organize">
  <summary>Organizar um bingo</summary>
  <form id="createForm" class="list" style="gap:12px">
    <div class="row">
      <label class="grow">Nome<input id="name" maxlength="40" placeholder="Bingo"></label>
    </div>
    <div class="row">
      <label class="grow">Cartela
        <select id="grid"><option value="3">3 × 3 (9 imagens)</option><option value="4" selected>4 × 4 (16 imagens)</option><option value="5">5 × 5 (24 imagens, centro livre)</option></select>
      </label>
      <label class="grow">Vitória
        <select id="pattern"><option value="line">Linha, coluna ou diagonal</option><option value="full">Cartela cheia</option></select>
      </label>
      <button class="primary" type="submit">Criar</button>
    </div>
  </form>
  <div id="createErr" class="error" hidden></div>
  </details>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
(() => {
  const { api } = Bingo;
  const err = (id, msg) => { const e = document.getElementById(id); e.textContent = msg || ""; e.hidden = !msg; };

  document.getElementById("joinForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("code").value.trim().toUpperCase();
    try { await api("GET", "/api/games/" + code); location.href = "/play?c=" + code; }
    catch (ex) { err("joinErr", ex.message); }
  });

  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault(); err("createErr", "");
    try {
      const name = document.getElementById("name").value || "Bingo";
      const r = await api("POST", "/api/games", { name, grid: document.getElementById("grid").value, pattern: document.getElementById("pattern").value });
      location.href = "/host?c=" + r.code + "&t=" + r.hostToken;
    } catch (ex) { err("createErr", ex.message); }
  });
})();
</script>
</body>
</html>

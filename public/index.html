<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page">
  <header><a href="/">Bingo</a></header>

  <h1>Entrar</h1>
  <form id="joinForm" class="row">
    <label class="grow">Código<input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="5 letras" required></label>
    <button class="primary" type="submit">Entrar</button>
  </form>
  <div id="joinErr" class="error" hidden></div>

  <div id="recent" hidden>
    <h2>Recentes</h2>
    <div id="recentList" class="list"></div>
  </div>

  <h2>Organizar</h2>
  <form id="createForm" class="list" style="gap:12px">
    <div class="row">
      <label class="grow">Nome<input id="name" maxlength="40" placeholder="Bingo"></label>
      <label class="grow">Senha do host<input id="password" type="password" required></label>
    </div>
    <div class="row">
      <label class="grow">Cartela
        <select id="grid"><option value="3">3 × 3 (9 imagens)</option><option value="4" selected>4 × 4 (16 imagens)</option><option value="5">5 × 5 (24 imagens, centro livre)</option></select>
      </label>
      <label class="grow">Vitória
        <select id="pattern"><option value="line">Linha, coluna ou diagonal</option><option value="full">Cartela cheia</option></select>
      </label>
      <button class="primary" type="submit">Criar</button>
    </div>
  </form>
  <div id="createErr" class="error" hidden></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
(() => {
  const { $, api, store } = Bingo;
  const err = (id, msg) => { const e = document.getElementById(id); e.textContent = msg || ""; e.hidden = !msg; };

  document.getElementById("joinForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = document.getElementById("code").value.trim().toUpperCase();
    try { await api("GET", "/api/games/" + code); location.href = "/play?c=" + code; }
    catch (ex) { err("joinErr", ex.message); }
  });

  document.getElementById("createForm").addEventListener("submit", async (e) => {
    e.preventDefault(); err("createErr", "");
    try {
      const name = document.getElementById("name").value || "Bingo";
      const r = await api("POST", "/api/games", { password: document.getElementById("password").value, name, grid: document.getElementById("grid").value, pattern: document.getElementById("pattern").value });
      const hosted = store.get("hosted") || [];
      hosted.unshift({ code: r.code, token: r.hostToken, name, at: Date.now() });
      store.set("hosted", hosted.slice(0, 20));
      location.href = "/host?c=" + r.code + "&t=" + r.hostToken;
    } catch (ex) { err("createErr", ex.message); }
  });

  const hosted = store.get("hosted") || [], played = store.get("played") || [];
  const list = document.getElementById("recentList");
  for (const h of hosted) list.append($("div", { class: "line" }, $("div", { class: "grow" }, $("h3", {}, h.name), $("span", { class: "note" }, h.code + " · host")), $("a", { href: "/host?c=" + h.code + "&t=" + h.token }, "painel")));
  for (const p of played) list.append($("div", { class: "line" }, $("div", { class: "grow" }, $("h3", {}, p.name || "Bingo"), $("span", { class: "note" }, p.code + " · " + p.player)), $("a", { href: "/play?c=" + p.code }, "cartela")));
  document.getElementById("recent").hidden = !list.children.length;
})();
</script>
</body>
</html>

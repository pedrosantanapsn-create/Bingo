<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bingo — tela</title>
<meta name="description" content="Bingo de imagens ao vivo. Entre com o código, receba sua cartela e acompanhe o sorteio.">
<meta name="theme-color" content="#1f3b2f">
<meta property="og:title" content="Bingo">
<meta property="og:description" content="Bingo de imagens ao vivo. Entre com o código e receba sua cartela.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f3b2f'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23f5f1e6' stroke-width='3'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='26' text-anchor='middle' fill='%23f5f1e6'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="screen">
<div class="page" id="app"><p class="muted">Carregando…</p></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
<script>
(() => {
  const { $, api, history, stage, winnersList, watch } = Bingo;
  const code = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  const app = document.getElementById("app");
  let players = [], lastCount = -1;
  if (!code) { location.href = "/"; return; }

  watch(code, async (s, byId) => {
    if (!s) { app.replaceChildren($("div", { class: "error" }, "Bingo apagado.")); return; }
    if (s.status === "setup" && s.playerCount !== lastCount) { lastCount = s.playerCount; try { players = (await api("GET", "/api/games/" + code + "/players")).players; } catch {} }
    app.replaceChildren();
    const link = location.origin + "/play?c=" + code;

    if (s.status === "setup") {
      app.append(
        $("div", {}, $("h1", {}, s.name), $("div", { class: "waiting" }, $("div", { class: "big" }, s.playerCount), $("div", { class: "label" }, "na sala de espera")), $("div", { class: "names" }, ...players.map((p) => $("span", {}, p.name)))),
        $("div", { class: "side" }, $("h2", {}, "Para entrar"), $("div", { class: "code" }, code), $("p", { class: "note" }, link), $("p", { class: "note", style: "margin-top:16px" }, "Cartela " + s.grid + "×" + s.grid + " · " + (s.pattern === "full" ? "cartela cheia" : "linha, coluna ou diagonal"))));
      return;
    }
    const last = s.draws.length ? byId[s.draws[s.draws.length - 1]] : null;
    app.append(
      $("div", {}, $("h1", {}, s.name), stage(last, s.draws.length + " de " + s.items.length + " sorteadas", "Aguardando o sorteio"), s.status === "finished" ? $("p", { class: "note", style: "text-align:center" }, "Encerrado") : null),
      $("div", { class: "side" },
        s.winners.length ? $("div", {}, $("h2", {}, "Vencedores"), winnersList(s.winners)) : null,
        $("h2", {}, "Já sorteadas (" + s.draws.length + ")"), s.draws.length ? history(s.draws, byId) : $("p", { class: "note" }, "Ainda nenhuma."),
        $("p", { class: "note", style: "margin-top:24px" }, s.cardCount + " cartelas em jogo")));
  });
})();
</script>
</body>
</html>
